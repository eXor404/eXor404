<svg xmlns="http://www.w3.org/2000/svg" width="640" height="126" viewBox="0 0 640 126" role="img" aria-label="Hello there. Maurice Daeppen, Fullstack, DevOps and Security, Bern, Switzerland">
  <title>General Kenobi!</title>
  <defs>
    <clipPath id="type">
      <rect x="22.0" y="51.0" height="25.0" width="0">
        <animate attributeName="width" dur="1.02s" fill="freeze"
                 calcMode="discrete" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" values="0.00;10.20;20.40;30.60;40.80;51.00;61.20;71.40;81.60;91.80;102.00;112.20;122.40"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="125" rx="10"
        fill="#150d24" stroke="#d8a0e8" stroke-opacity="0.26"/>

  <text x="22.0" y="42.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="14"
        fill="#d8a0e8" textLength="67.2" lengthAdjust="spacingAndGlyphs">$ whoami</text>

  <g clip-path="url(#type)">
    <text x="22.0" y="68.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="17"
          font-weight="700" fill="#f2e6f8"
          textLength="122.4" lengthAdjust="spacingAndGlyphs">Hello there.</text>
  </g>

  <rect y="53.0" width="10.2" height="17" fill="#f8a0d0" x="22.0">
    <animate attributeName="x" dur="1.02s" fill="freeze"
             calcMode="discrete" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" values="22.00;32.20;42.40;52.60;62.80;73.00;83.20;93.40;103.60;113.80;124.00;134.20;144.40"/>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s"
             begin="1.02s" repeatCount="indefinite"/>
  </rect>

  <text x="22.0" y="94.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="12"
        fill="#a892c0" opacity="0">Maurice Däppen  ·  Fullstack, DevOps &amp; Security  ·  Bern, CH
    <animate attributeName="opacity" from="0" to="1" dur="0.5s"
             begin="1.17s" fill="freeze"/>
  </text>
</svg>
